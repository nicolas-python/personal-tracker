<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <title>Meine Trainingspläne</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <h1>Meine Trainingspläne</h1>

    {% for workout in workouts %}

        <div class="workout">
            Workout {{ loop.index }} = {{ workout[1] }}
            <div class="exercises">
                {% for exercise in workout_exercises[workout[0]] %}
                <div>
                    {{ exercise[0] }}
                </div>
                {% endfor %}
            </div>

        </div>
    {% endfor %}
</body>

</html>
