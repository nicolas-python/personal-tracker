<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rezepte - Personal Tracker</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="recipes-page">

    <h1>Rezepte</h1>

    <button class="backButton" type="button" onclick="window.location.href='/selection'">
        Zurück
    </button>

    <div class="recipe-search-container">
        <h2>Rezeptsuche</h2>

        <form id="recipeSearchForm">
            <input
                type="text"
                id="recipeSearch"
                placeholder="Rezept oder Zutat suchen ...">

            <button type="submit">Suchen</button>
        </form>

    </div>

    <div id="recipeResults" class="recipe-results-container"></div>

    <script>
        const recipeSearchForm = document.getElementById("recipeSearchForm");
        const recipeSearch = document.getElementById("recipeSearch");
        const recipeResults = document.getElementById("recipeResults");

        recipeSearchForm.addEventListener("submit", async function(event)
        {
            event.preventDefault();

            const searchTerm = recipeSearch.value.trim();

            if (searchTerm === "")
            {
                recipeResults.innerHTML = "<p>Bitte gib einen Suchbegriff ein.</p>";
                return;
            }

            recipeResults.innerHTML = "<p>Rezepte werden gesucht ...</p>";

            try
            {
                //Übersetzer raspberrypi
                const translationResponse = await fetch("/translate", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        text: searchTerm,
                        source: "de",
                        target: "en"
                    })
                });

                if (!translationResponse.ok)
                {
                    throw new Error("Übersetzung fehlgeschlagen");
                }

                const translationData = await translationResponse.json();

                //Deutsche Fleischbegriffe erkennen und passend übersetzen für API(TheMealDB)
                const germanSearchTerm = searchTerm.toLowerCase();

                let englishSearchTerm = translationData.translatedText;

                if (germanSearchTerm.includes("schwein"))
                    {
                        englishSearchTerm = "Pork";
                    }
                else if (germanSearchTerm.includes("rind"))
                    {
                        englishSearchTerm = "Beef";
                    }
                else if (germanSearchTerm.includes("huhn") || germanSearchTerm.includes("hühn") || germanSearchTerm.includes("hähnchen"))
                    {
                        englishSearchTerm = "Chicken";
                    }
                else if (germanSearchTerm.includes("pute"))
                    {
                        englishSearchTerm = "Turkey";
                    }
                else if (germanSearchTerm.includes("lamm"))
                    {
                        englishSearchTerm = "Lamb";
                    }
                else if (germanSearchTerm.includes("ente"))
                    {
                        englishSearchTerm = "Duck";
                    }
                else if (germanSearchTerm.includes("gans"))
                    {
                        englishSearchTerm = "Goose";
                    }

                let response = await fetch(
                        "https://www.themealdb.com/api/json/v1/1/search.php?s="
                        + encodeURIComponent(englishSearchTerm)
                );

                let data = await response.json();

                //Rezeptdatenbank(recipes.db) durchsuchen
                const localResponse = await fetch(
                    "/search-recipes?q=" + encodeURIComponent(englishSearchTerm)
                );

                const localData = await localResponse.json();

                if (!data.meals)
                {
                    response = await fetch(
                            "https://www.themealdb.com/api/json/v1/1/filter.php?i="
                            + encodeURIComponent(englishSearchTerm)
                    );

                    data = await response.json();
                }

                // Prüfen, ob eine der beiden Quellen Rezepte gefunden hat
                if (!data.meals && localData.recipes.length === 0) {
                    recipeResults.innerHTML = "<p>Keine Rezepte gefunden</p>";
                    return;
                }

                recipeResults.innerHTML = "";

                //Rezepte aus TheMealDB API anzeigen
                if (data.meals)
                {
                    data.meals.forEach(function (meal)
                    {
                        const recipeCard = document.createElement("div");
                        recipeCard.className = "recipe-card";

                        const recipeImage = document.createElement("img");
                        recipeImage.src = meal.strMealThumb;
                        recipeImage.alt = meal.strMeal;

                        const recipeName = document.createElement("h3");
                        recipeName.textContent = meal.strMeal;

                        recipeCard.appendChild(recipeImage);
                        recipeCard.appendChild(recipeName);

                        recipeCard.addEventListener("click", function ()
                        {
                            loadRecipeDetails(meal.idMeal);
                        });

                        recipeResults.appendChild(recipeCard);
                    });
                }

                //Rezepte Datenbank anzeigen
                if (localData.recipes.length > 0)
                {
                    const heading = document.createElement("h2");
                    heading.textContent = "Rezepte aus recipes.db";
                    recipeResults.appendChild(heading);

                    localData.recipes.forEach(function (recipe)
                    {
                        const recipeCard = document.createElement("div");
                        recipeCard.className = "recipe-card";

                        const recipeName = document.createElement("h3");
                        recipeName.textContent = recipe.title;

                        recipeCard.appendChild(recipeName);

                        //Rezeptdetails aus recipes laden
                        recipeCard.addEventListener("click", function ()
                        {
                            loadLocalRecipeDetails(recipe.id);
                        });

                        recipeResults.appendChild(recipeCard);
                    });
                }
            }

            catch (error)
                {
                    recipeResults.innerHTML = "<p>Die Rezepte konnten nicht geladen werden. Bitte versuche es erneut</p>";
                    console.error("Fehler bei der Rezeptsuche:", error);
                }
        });

        async function translateText(text)
        {
            if (!text || text.trim() === "")
                {
                    return text;
                }

            const response = await fetch("/translate",
            {
                method: "POST",
                headers:
                    {
                        "Content-Type": "application/json"
                    },
                body: JSON.stringify(
                    {
                        text: text,
                        source: "en",
                        target: "de"
                    })
            });

            if (!response.ok)
                {
                    throw new Error("Übersetzung fehlgeschlagen");
                }

            const data = await response.json();

            return data.translatedText;
        }

        async function loadRecipeDetails(mealId)
        {
            try
            {
                const response = await fetch(
                    "https://www.themealdb.com/api/json/v1/1/lookup.php?i="
                    + mealId
                );

                const data = await response.json();

                if (!data.meals)
                {
                    recipeResults.innerHTML = "<p>Rezeptdetails konnten nicht geladen werden.</p>";
                    return;
                }

                const meal = data.meals[0];
                const germanTitle = await translateText(meal.strMeal);
                const ingredients = [];

                let i = 1;

                while (i <= 20)                                     //Zutaten limiter ,bis zu 20 zutaten anzeigen
                {
                    const ingredient = meal["strIngredient" + i];
                    const measure = meal["strMeasure" + i];

                    if (ingredient && ingredient.trim() !== "")
                    {
                        ingredients.push({
                            name: ingredient.trim(),
                            amount: measure ? measure.trim() : ""
                        });
                    }

                    i = i + 1;
                }

                recipeResults.innerHTML = "";

                //container für Rezeptdetails erstellen
                const recipeDetails = document.createElement("div");
                recipeDetails.className = "recipe-details";

                //rezeptname
                const recipeName = document.createElement("h2");
                recipeName.textContent = germanTitle;

                //rezeptbild
                const recipeImage = document.createElement("img");
                recipeImage.src = meal.strMealThumb;
                recipeImage.alt = meal.strMeal;

                //überschrift für die Zubereitung
                const instructionsHeading = document.createElement("h3");
                instructionsHeading.textContent = "Zubereitung";

                const translationStatus = document.createElement("small");
                translationStatus.textContent = "Zubereitung wird übersetzt ...";
                translationStatus.className = "translation-status";

                //zubereitungstext erstellen
                const instructions = document.createElement("p");
                instructions.textContent = meal.strInstructions;

                recipeDetails.appendChild(recipeName);
                recipeDetails.appendChild(recipeImage);

                //ztatenüberschrift erstellen
                const ingredientsHeading = document.createElement("h3");
                ingredientsHeading.textContent = "Zutaten";
                recipeDetails.appendChild(ingredientsHeading);

                //zutatenliste erstellen
                const ingredientsList = document.createElement("ul");           //<ul> = Unordered List = eine ungeordnete Liste mit Aufzählungspunkten

                ingredients.forEach(function (ingredient)
                {
                    const ingredientItem = document.createElement("li");        //<li> = List Item = ein einzelner Listeneintrag

                    ingredientItem.textContent = ingredient.amount + " " + ingredient.name;

                    ingredientsList.appendChild(ingredientItem);

                    translateText(ingredient.amount + " " + ingredient.name)
                            .then(function (germanIngredient)
                                {
                                    ingredientItem.textContent = germanIngredient;
                                })
                            .catch(function (error)
                                {
                                    console.error("Fehler bei der Zutatenübersetzung:", error);
                                });
                });

                recipeDetails.appendChild(ingredientsList);

                const instructionsHeader = document.createElement("div");
                instructionsHeader.className = "instructions-header";

                instructionsHeader.appendChild(instructionsHeading);
                instructionsHeader.appendChild(translationStatus);

                recipeDetails.appendChild(instructionsHeader);
                recipeDetails.appendChild(instructions);

                recipeResults.appendChild(recipeDetails);

                translateText(meal.strInstructions)
                        .then(function (germanInstructions)
                            {
                                instructions.textContent = germanInstructions;
                                translationStatus.remove();
                            })
                        .catch(function (error)
                            {
                                console.error("Fehler bei der Übersetzung:", error);
                                translationStatus.textContent = "Übersetzung fehlgeschlagen.";
                            });
            }

            catch (error)
                {
                    recipeResults.innerHTML = "<p>Fehler beim Laden der Rezeptdetails.</p>";
                    console.error("Fehler:", error);
                }
        }

        async function loadLocalRecipeDetails(recipeId)
        {
            try
            {
                const response = await fetch(`/get-recipe/${recipeId}`);
                const recipe = await response.json();

                if (!response.ok)
                {
                    recipeResults.innerHTML = "<p>Rezeptdetails konnten nicht geladen werden.</p>";
                    return;
                }

                //Zutaten aus DB (Python-Listenformat verarbeitet (kein JSON))   //Unterschied: Python verwendet einfache Anführungszeichen ('')
                const ingredients = recipe.ingredients                           //JSON verwendet doppelte Anführungszeichen ("")
                        .replace(/^\[|\]$/g, "")                //entfernt die öffnende Klammer am Anfang und die schließende Klammer am Ende (cheatsheet)
                        .split(", ")
                        .map(function (ingredient)
                            {
                                return ingredient.replace(/^'|'$/g, "");            //entfernt die einfachen Anführungszeichen am Anfang und Ende jeder Zutat
                            });

                recipeResults.innerHTML = "";

                //container für Rezeptdetails
                const recipeDetails = document.createElement("div");
                recipeDetails.className = "recipe-details";

                //rezeptname
                const recipeName = document.createElement("h2");
                const germanTitle = await translateText(recipe.title);
                recipeName.textContent = germanTitle;

                const instructionsHeading = document.createElement("h3");
                instructionsHeading.textContent = "Zubereitung";

                const translationStatus = document.createElement("small");
                translationStatus.textContent = "Zubereitung wird übersetzt ...";
                translationStatus.className = "translation-status";

                //zubereitungstext erstellen
                const instructions = document.createElement("p");
                instructions.textContent = recipe.instructions;

                recipeDetails.appendChild(recipeName);

                const ingredientsHeading = document.createElement("h3");
                ingredientsHeading.textContent = "Zutaten";
                recipeDetails.appendChild(ingredientsHeading);

                //zutatenliste erstellen
                const ingredientsList = document.createElement("ul");

                ingredients.forEach(function (ingredient)
                {
                    const ingredientItem = document.createElement("li");
                    ingredientItem.textContent = ingredient;
                    ingredientsList.appendChild(ingredientItem);

                    translateText(ingredient)
                            .then(function (germanIngredient)
                                {
                                    ingredientItem.textContent = germanIngredient;
                                })
                            .catch(function (error)
                                {
                                    console.error("Fehler bei der Zutatenübersetzung:", error);
                                });
                });

                recipeDetails.appendChild(ingredientsList);

                const instructionsHeader = document.createElement("div");
                instructionsHeader.className = "instructions-header";

                instructionsHeader.appendChild(instructionsHeading);
                instructionsHeader.appendChild(translationStatus);

                recipeDetails.appendChild(instructionsHeader);
                recipeDetails.appendChild(instructions);

                recipeResults.appendChild(recipeDetails);

                translateText(recipe.instructions)
                    .then(function (germanInstructions)
                        {
                            instructions.textContent = germanInstructions;
                            translationStatus.remove();
                        })
                    .catch(function (error)
                        {
                            console.error("Fehler bei der Übersetzung:", error);
                            translationStatus.textContent = "Übersetzung fehlgeschlagen.";
                        });
            }

            catch (error)
                {
                    recipeResults.innerHTML = "<p>Fehler beim Laden der Rezeptdetails.</p>";
                    console.error("Fehler:", error);
                }
        }
    </script>
</body>
</html>
