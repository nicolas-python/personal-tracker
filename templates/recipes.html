<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rezepte - Personal Tracker</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="recipes-page">

    <h1>Rezepte</h1>

    <button class="backButton" type="button" onclick="window.location.href='/selection'">
        Zurück
    </button>

    <div class="recipe-search-container">
        <h2>Rezeptsuche</h2>

        <form id="recipeSearchForm">
            <input
                type="text"
                id="recipeSearch"
                placeholder="Rezept oder Zutat suchen ...">

            <button type="submit">Suchen</button>
        </form>

    </div>

    <div id="recipeResults" class="recipe-results-container"></div>

    <script>
        const recipeSearchForm = document.getElementById("recipeSearchForm");
        const recipeSearch = document.getElementById("recipeSearch");
        const recipeResults = document.getElementById("recipeResults");

        recipeSearchForm.addEventListener("submit", async function(event)
        {
            event.preventDefault();

            const searchTerm = recipeSearch.value.trim();

            if (searchTerm === "")
            {
                recipeResults.innerHTML = "<p>Bitte gib einen Suchbegriff ein.</p>";
                return;
            }

            recipeResults.innerHTML = "<p>Rezepte werden gesucht ...</p>";

            try
            {
                //Übersetzer raspberrypi
                const translationResponse = await fetch("/translate", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        text: searchTerm,
                        source: "de",
                        target: "en"
                    })
                });

                if (!translationResponse.ok)
                {
                    throw new Error("Übersetzung fehlgeschlagen");
                }

                const translationData = await translationResponse.json();
                const englishSearchTerm = translationData.translatedText;

                let response = await fetch(
                        "https://www.themealdb.com/api/json/v1/1/search.php?s="
                        + encodeURIComponent(englishSearchTerm)
                );

                let data = await response.json();

                if (!data.meals)
                {
                    response = await fetch(
                            "https://www.themealdb.com/api/json/v1/1/filter.php?i="
                            + encodeURIComponent(englishSearchTerm)
                    );

                    data = await response.json();
                }

                if (!data.meals)
                {
                    recipeResults.innerHTML = "<p>Keine Rezepte gefunden</p>";
                    return;
                }

                recipeResults.innerHTML = "";

                data.meals.forEach(function (meal)
                {
                    const recipeCard = document.createElement("div");
                    recipeCard.className = "recipe-card";

                    //bild erstellen
                    const recipeImage = document.createElement("img");
                    recipeImage.src = meal.strMealThumb;
                    recipeImage.alt = meal.strMeal;

                    //name erstellen
                    const recipeName = document.createElement("h3");
                    recipeName.textContent = meal.strMeal;

                    recipeCard.appendChild(recipeImage);
                    recipeCard.appendChild(recipeName);


                    recipeCard.addEventListener("click", function ()
                    {
                        loadRecipeDetails(meal.idMeal);
                    });

                    recipeResults.appendChild(recipeCard);
                });
            }

            catch (error)
                {
                    recipeResults.innerHTML = "<p>Die Rezepte konnten nicht geladen werden. Bitte versuche es erneut</p>";
                    console.error("Fehler bei der Rezeptsuche:", error);
                }
        });


        async function loadRecipeDetails(mealId)
        {
            try
            {
                const response = await fetch(
                    "https://www.themealdb.com/api/json/v1/1/lookup.php?i="
                    + mealId
                );

                const data = await response.json();

                if (!data.meals)
                {
                    recipeResults.innerHTML = "<p>Rezeptdetails konnten nicht geladen werden.</p>";
                    return;
                }

                const meal = data.meals[0];
                const ingredients = [];

                let i = 1;

                while (i <= 20)                                     //Zutaten limiter ,bis zu 20 zutaten anzeigen
                {
                    const ingredient = meal["strIngredient" + i];
                    const measure = meal["strMeasure" + i];

                    if (ingredient && ingredient.trim() !== "")
                    {
                        ingredients.push({
                            name: ingredient.trim(),
                            amount: measure ? measure.trim() : ""
                        });
                    }

                    i = i + 1;
                }

                recipeResults.innerHTML = "";

                //container für Rezeptdetails erstellen
                const recipeDetails = document.createElement("div");
                recipeDetails.className = "recipe-details";

                //rezeptname
                const recipeName = document.createElement("h2");
                recipeName.textContent = meal.strMeal;

                //rezeptbild
                const recipeImage = document.createElement("img");
                recipeImage.src = meal.strMealThumb;
                recipeImage.alt = meal.strMeal;

                //überschrift für die Zubereitung
                const instructionsHeading = document.createElement("h3");
                instructionsHeading.textContent = "Zubereitung";

                //zubereitungstext erstellen
                const instructions = document.createElement("p");
                instructions.textContent = meal.strInstructions;

                recipeDetails.appendChild(recipeName);
                recipeDetails.appendChild(recipeImage);

                //ztatenüberschrift erstellen
                const ingredientsHeading = document.createElement("h3");
                ingredientsHeading.textContent = "Zutaten";
                recipeDetails.appendChild(ingredientsHeading);

                //zutatenliste erstellen
                const ingredientsList = document.createElement("ul");

                ingredients.forEach(function (ingredient)
                {
                    const ingredientItem = document.createElement("li");

                    ingredientItem.textContent =
                            ingredient.amount + " " + ingredient.name;

                    ingredientsList.appendChild(ingredientItem);
                });

                recipeDetails.appendChild(ingredientsList);

                recipeDetails.appendChild(instructionsHeading);
                recipeDetails.appendChild(instructions);

                recipeResults.appendChild(recipeDetails);
            }

            catch (error)
                {
                    recipeResults.innerHTML = "<p>Fehler beim Laden der Rezeptdetails.</p>";
                    console.error("Fehler:", error);
                }
        }
    </script>
</body>
</html>
