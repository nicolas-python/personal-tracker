<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ernährung - Personal Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <h1>Ernährung</h1>

    <button class="backButton" type="button"
            onclick="window.location.href='/selection'">
        Zurück
    </button>

<!---------------------------------------------Tagesübersicht--------------------------------------------->

    <div class="nutrition-container">

        <h2>Heute</h2>

        <label for="nutritionDate">Datum:</label>
        <input type="date" id="nutritionDate" name="date">

        <p id="nutritionDateText"></p>
    </div>
<!-- -------------------------------------------Kalorienbedarfsrechner------------------------------------------- -->
    <details class="calorie-calculator">
        <summary>Kalorienbedarfsrechner</summary>
        <div class="calorin-inputs">

            <label for="gender">Geschlecht</label>
            <select id="gender" name="gender">
                <option value="male">Männlich</option>
                <option value="female">Weiblich</option>
            </select>

            <label for="age">Alter in Jahren:></label>
            <input type="number" id="age" name="age" min="1" max="150" requierd>


            <label for="height">Größe in cm:</label>
            <input type="number" id="height" name="height" min="50" max="250" required>

            <label for="weight">Gewicht in kg:</label>
            <input type="number" id="weight" name="weight" min="10" max="500" step="0.1" required>

            <label for="activity">Aktivitätslevel:</label>
            <select id="activity" name="activity">
                <option value="1.2">Wenig Bewegung</option>
                <option value="1.375">Leicht aktiv</option>
                <option value="1.55">Moderat aktiv</option>
                <option value="1.725">Sehr aktiv</option>
                <option value="1.9">Extrem aktiv</option>
            </select>

            <label for="goal">Ziel:</label>
            <select id="goal" name="goal">
                <option value="lose">Abnehmen</option>
                <option value="maintain">Gewicht halten</option>
                <option value="gain">Zunehmen</option>
            </select>

            <button type="button" id="calculateCalories">Kalorienbedarf berechnen</button>

        </div>
    </details>

<!---------------------------------------------Kalorien und Protein------------------------------------>
    <div class="nutrition-summary">

        <div class="nutrition-card">
            <h3>Kalorien</h3>
            <p><strong id="caloriesConsumed">--</strong> kcal</p>
            <p>von <span id="caloriesGoal">--</span> kcal</p>
        </div>

        <div class="nutrition-card">
            <h3>Protein</h3>
            <p><strong id="proteinConsumed">--</strong> g</p>
            <p>von <span id="proteinGoal">--</span> g</p>
        </div>
    </div>
<!---------------------------------------------Frühstück----------------------------------------------->
<!---------------------------------------------Mittagessen--------------------------------------------->
<!---------------------------------------------Abendessen---------------------------------------------->
<!---------------------------------------------Lebensmittel hinzufügen--------------------------------->
    <script>
        //Datumseingabe und Textanzeige aus dem HTML holen
        const nutritionDate = document.getElementById("nutritionDate");
        const nutritionDateText = document.getElementById("nutritionDateText");

        //aktuelles Datum erstellen
        const today = new Date();                                       //Date ist eine eingebaute Funktion von JavaScript die das aktuelle Uhrzeit des Systems abfragt
        const year = today.getFullYear();
        const month = String(today.getMonth() + 1).padStart(2, "0");
        const day = String(today.getDate()).padStart(2, "0");

        nutritionDate.value = `${year}-${month}-${day}`;                //Template Literal

        //Ausgewähltes Datum auf Deutsch anzeigen
        function updateNutritionDate()
        {
            const selectedDate = new Date(nutritionDate.value + "T12:00:00");   //T trennt Datum und Uhrzeit; 12:00:00 bedeutet 12 Uhr mittags (Stunde:Minute:Sekunde)
                                                                                //verhindert, dass das Datum durch Zeitzonenverschiebungen versehentlich auf den Vortag oder Folgetag fällt
            nutritionDateText.textContent = new Intl.DateTimeFormat("de-DE",
                    {
                        weekday: "long",
                        day: "numeric",
                        month: "long",
                        year: "numeric"
                    }).format(selectedDate);
        }

        // Datum beim Laden und nach einer Änderung anzeigen
        updateNutritionDate();
        nutritionDate.addEventListener("change", updateNutritionDate);
    </script>

</body>
</html>
