<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ernährung - Personal Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <h1>Ernährung</h1>

    <button class="backButton" type="button"
            onclick="window.location.href='/selection'">
        Zurück
    </button>

<!---------------------------------------------Tagesübersicht--------------------------------------------->

    <div class="nutrition-container">

        <h2>Heute</h2>

        <label for="nutritionDate">Datum:</label>
        <input type="date" id="nutritionDate" name="date">

        <p id="nutritionDateText"></p>
    </div>
<!-- -------------------------------------------Kalorienbedarfsrechner------------------------------------------- -->
    <details class="calorie-calculator">
        <summary>Kalorienbedarfsrechner</summary>
        <form class="calorin-inputs" id="calorieForm">

            <label for="gender">Geschlecht</label>
            <select id="gender" name="gender">
                <option value="male">Männlich</option>
                <option value="female">Weiblich</option>
            </select>

            <label for="age">Alter in Jahren:</label>
            <input type="number" id="age" name="age" min="1" max="150" required>

            <label for="height">Größe in cm:</label>
            <input type="number" id="height" name="height" min="50" max="250" required>

            <label for="weight">Gewicht in kg:</label>
            <input type="number" id="weight" name="weight" min="10" max="500" step="0.1" required>

            <label for="activity">Aktivitätslevel:</label>
            <select id="activity" name="activity">
                <option value="1.2">Wenig Bewegung</option>
                <option value="1.375">Leicht aktiv</option>
                <option value="1.55">Moderat aktiv</option>
                <option value="1.725">Sehr aktiv</option>
                <option value="1.9">Extrem aktiv</option>
            </select>

            <label for="goal">Ziel:</label>
            <select id="goal" name="goal">
                <option value="lose">Abnehmen</option>
                <option value="maintain">Gewicht halten</option>
                <option value="gain">Zunehmen</option>
            </select>

            <button type="button" id="calculateCalories">Kalorienbedarf berechnen</button>
            <p id="calorieResult"></p>
        </form>
    </details>

<!---------------------------------------------Kalorien und Protein------------------------------------>
    <div class="nutrition-summary">

        <div class="nutrition-card">
            <h3>Kalorien</h3>
            <p><strong id="caloriesConsumed"></strong> kcal</p>
            <p>von <span id="caloriesGoal"></span> kcal</p>

            <div class="progress-bar">
                <div id="calorieProgressBar" class="progress-fill"></div>
            </div>
        </div>

        <div class="nutrition-card">
            <h3>Protein</h3>
            <p><strong id="proteinConsumed"></strong> g</p>
            <p>von <span id="proteinGoal"></span> g</p>

            <div class="progress-bar">
                <div id="proteinProgressBar" class="progress-fill"></div>
            </div>
        </div>
    </div>
<!---------------------------------------------Frühstück----------------------------------------------->
    <div class="nutrition-meal-card" id="breakfast">

        <h2>Frühstück</h2>
            <div class="meal-food-list" id="breakfastFoods">
                <!-- Lebensmittel angezeigt/Lebensmittel hinzufügen -->
            </div>

        <button type="button" class="add-food-button" data-meal="breakfast">Lebensmittel hinzufügen</button>

    </div>
<!---------------------------------------------Mittagessen--------------------------------------------->
    <div class="nutrition-meal-card" id="lunch">

        <h2>Mittagessen</h2>
            <div class="meal-food-list" id="lunchFoods">
                <!-- Lebensmittel angezeigt/Lebensmittel hinzufügen -->
            </div>

        <button type="button" class="add-food-button" data-meal="lunch">Lebensmittel hinzufügen</button>

    </div>
<!---------------------------------------------Abendessen---------------------------------------------->
    <div class="nutrition-meal-card" id="dinner">

        <h2>Abendessen</h2>
            <div class="meal-food-list" id="dinnerFoods">
                <!-- Lebensmittel angezeigt/Lebensmittel hinzufügen -->
            </div>

        <button type="button" class="add-food-button" data-meal="dinner">Lebensmittel hinzufügen</button>

    </div>
<!---------------------------------------------Snacks---------------------------------------------->
    <div class="nutrition-meal-card" id="snacks">

        <h2>Snacks</h2>
            <div class="meal-food-list" id="snacksFoods">
                <!-- Lebensmittel angezeigt/Lebensmittel hinzufügen -->
            </div>

        <button type="button" class="add-food-button" data-meal="snacks">Lebensmittel hinzufügen</button>

    </div>
<!---------------------------------------------Lebensmittel hinzufügen--------------------------------->

    <div id="foodSearch" hidden>

        <h2>Lebensmittel hinzufügen</h2>

        <label for="foodSearchInput">Lebensmittel suchen:</label>
        <input type="search" id="foodSearchInput" placeholder="z. B. Harzer Käse">

        <button type="button" id="searchFoodButton">Suchen</button>

        <div id="foodSearchResults">
            <!--Suchergebnisse angezeigen -->
        </div>

        <button type="button" id="closeFoodSearch">Schließen</button>

    </div>


    <script>
        //Datumseingabe und Textanzeige aus dem HTML holen
        const nutritionDate = document.getElementById("nutritionDate");
        const nutritionDateText = document.getElementById("nutritionDateText");

        //aktuelles Datum erstellen
        const today = new Date();                                       //Date ist eine eingebaute Funktion von JavaScript die das aktuelle Uhrzeit des Systems abfragt
        const year = today.getFullYear();
        const month = String(today.getMonth() + 1).padStart(2, "0");
        const day = String(today.getDate()).padStart(2, "0");

        nutritionDate.value = `${year}-${month}-${day}`;                //Template Literal

        //Ausgewähltes Datum auf Deutsch anzeigen
        function updateNutritionDate()
        {
            const selectedDate = new Date(nutritionDate.value + "T12:00:00");   //T trennt Datum und Uhrzeit; 12:00:00 bedeutet 12 Uhr mittags (Stunde:Minute:Sekunde)
                                                                                //verhindert, dass das Datum durch Zeitzonenverschiebungen versehentlich auf den Vortag oder Folgetag fällt
            nutritionDateText.textContent = new Intl.DateTimeFormat("de-DE",
                    {
                        weekday: "long",
                        day: "numeric",
                        month: "long",
                        year: "numeric"
                    }).format(selectedDate);
        }

        // Datum beim Laden und nach einer Änderung anzeigen
        updateNutritionDate();
        nutritionDate.addEventListener("change", updateNutritionDate);


        //Kalorienbedarfsrechner
        const calorieForm = document.getElementById("calorieForm");
        const calculateButton = document.getElementById("calculateCalories");

        function CalorieNeedsCalculator()
        {
            if (!calorieForm.reportValidity())      //reportValidity = Prüft die HTML-Regeln deiner Eingabefelden ! kehrt true und false um
                {
                    return;
                }

            const formValues = Object.fromEntries(new FormData(calorieForm));

            const gender = formValues.gender;
            const weight = Number(formValues.weight);
            const height = Number(formValues.height);
            const age = Number(formValues.age);

            const activity = Number(formValues.activity);
            const goal = formValues.goal;

            let restingMetabolism;
            if (gender === "male")
                {
                    restingMetabolism = (10 * weight)+(6.25 * height)-(5 * age) + 5
                }

            else if (gender === "female")
                {
                    restingMetabolism = (10 * weight)+(6.25 * height)-(5 * age) - 161
                }
            else
                {
                    alert("Bitte alle Felder ausfüllen und auswählen.");
                    return;
                }

            const calorieNeeds = restingMetabolism * activity;

            let caloriegoal;

            if (goal === "lose")
                {caloriegoal = calorieNeeds - 400}
            else if (goal === "maintain")
                {caloriegoal = calorieNeeds - 0}
            else if (goal === "gain")
                {caloriegoal = calorieNeeds + 400}

            else
                {
                    alert("Bitte alle Felder ausfüllen und auswählen.");
                    return;
                }
            const proteinGoal = weight * 1.5;

            document.getElementById("calorieResult").textContent = "Dein Kalorienziel: " + Math.round(caloriegoal) + " kcal pro Tag";

            document.getElementById("caloriesGoal").textContent = Math.round(caloriegoal);
            document.getElementById("proteinGoal").textContent = Math.round(proteinGoal);
        }

        calculateButton.addEventListener("click", CalorieNeedsCalculator);


        const addFoodButtons = document.querySelectorAll(".add-food-button");
        const foodSearch = document.getElementById("foodSearch");
        const closeFoodSearchButton = document.getElementById("closeFoodSearch");
        let selectedMeal = "";

        function addFoodButton(event)
        {
            const selectedMealCard = event.currentTarget.closest(".nutrition-meal-card");       // Suchfenster unter die angeklickte Mahlzeitenkarte verschieben
            selectedMealCard.appendChild(foodSearch);

            selectedMeal = event.currentTarget.dataset.meal;
            foodSearch.hidden = false;
        }

        //Alle Lebensmittel Buttons mit der Funktion verbinden
        addFoodButtons.forEach(function (button) {button.addEventListener("click", addFoodButton);});


        function closeFoodSearch()
        {
            foodSearch.hidden = true;
        }

        closeFoodSearchButton.addEventListener("click", closeFoodSearch);


        //Lebensmittelsuche
        const foodSearchInput = document.getElementById("foodSearchInput");
        const searchFoodButton = document.getElementById("searchFoodButton");
        const foodSearchResults = document.getElementById("foodSearchResults");

        let selectedProduct = null;

        async function searchFood()                         //async = warten ohne website aufzuhalten
        {
            const searchTerm = foodSearchInput.value.trim();

            if (searchTerm === "")
            {
                foodSearchResults.textContent = "Bitte gib ein Lebensmittel ein.";
                return;
            }

            foodSearchResults.textContent = "Suche läuft...";

            try
            {
                const response = await fetch(`/search-food?q=${encodeURIComponent(searchTerm)}`);

                // Antwort von Flask als JSON auslesen
                const data = await response.json();

                if (!response.ok)
                {
                    foodSearchResults.textContent = data.error || "Die Suche ist fehlgeschlagen";
                    return;
                }

                const products = data.hits || [];

                //Alte Suchergebnisse entfernen
                foodSearchResults.replaceChildren();

                if (products.length === 0)
                {
                    foodSearchResults.textContent = "Keine Lebensmittel gefunden.";
                    return;
                }

                //HTML anzeigen
                products.forEach(function (product)
                {
                    //Button für das gefundene Produkt erstellen
                    const productButton = document.createElement("button");

                    productButton.type = "button";
                    productButton.className = "food-result-button";

                    productButton.textContent = product.product_name || "Produktname nicht vorhanden";

                    productButton.addEventListener("click", function ()
                    {
                        selectedProduct = product;

                        foodSearchResults.querySelectorAll(".food-result-button").forEach(function (button)
                        {
                            button.classList.remove("selected");
                        });

                        productButton.classList.add("selected");

                    });

                    foodSearchResults.appendChild(productButton);
                });
            }
            catch (error)
            {
                console.error("Fehler bei der Lebensmittelsuche:", error);
                foodSearchResults.textContent = "Die Suche ist fehlgeschlagen. Bitte prüfe die Verbindung";
            }

        }

        searchFoodButton.addEventListener("click", searchFood);

    </script>

</body>
</html>
