<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ernährung - Personal Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <h1>Ernährung</h1>

    <button class="backButton" type="button"
            onclick="window.location.href='/selection'">
        Zurück
    </button>

<!---------------------------------------------Tagesübersicht--------------------------------------------->

    <div class="nutrition-container">

        <h2>Heute</h2>

        <label for="nutritionDate">Datum:</label>
        <input type="date" id="nutritionDate" name="date">

        <p id="nutritionDateText"></p>
    </div>
<!-- -------------------------------------------Kalorienbedarfsrechner------------------------------------------- -->
    <details class="calorie-calculator">
        <summary>Kalorienbedarfsrechner</summary>
        <form class="calorin-inputs" id="calorieForm">

            <label for="gender">Geschlecht</label>
            <select id="gender" name="gender">
                <option value="male">Männlich</option>
                <option value="female">Weiblich</option>
            </select>

            <label for="age">Alter in Jahren:</label>
            <input type="number" id="age" name="age" min="1" max="150" required>

            <label for="height">Größe in cm:</label>
            <input type="number" id="height" name="height" min="50" max="250" required>

            <label for="weight">Gewicht in kg:</label>
            <input type="number" id="weight" name="weight" min="10" max="500" step="0.1" required>

            <label for="activity">Aktivitätslevel:</label>
            <select id="activity" name="activity">
                <option value="1.2">Wenig Bewegung</option>
                <option value="1.375">Leicht aktiv</option>
                <option value="1.55">Moderat aktiv</option>
                <option value="1.725">Sehr aktiv</option>
                <option value="1.9">Extrem aktiv</option>
            </select>

            <label for="goal">Ziel:</label>
            <select id="goal" name="goal">
                <option value="lose">Abnehmen</option>
                <option value="maintain">Gewicht halten</option>
                <option value="gain">Zunehmen</option>
            </select>

            <button type="button" id="calculateCalories">Kalorienbedarf berechnen</button>
            <p id="calorieResult"></p>
        </form>
    </details>

<!---------------------------------------------Kalorien und Protein------------------------------------>
    <div class="nutrition-summary">

        <div class="nutrition-card">
            <h3>Kalorien</h3>
            <p><strong id="caloriesConsumed"></strong> kcal</p>
            <span id="caloriesGoal" data-saved-calories="{{ calorie_needs[0] if calorie_needs else '' }}"></span>

            <div class="progress-bar">
                <div id="calorieProgressBar" class="progress-fill"></div>
            </div>
        </div>

        <div class="nutrition-card">
            <h3>Protein</h3>
            <p><strong id="proteinConsumed"></strong> g</p>
            <span id="proteinGoal" data-saved-protein="{{ calorie_needs[1] if calorie_needs else '' }}"></span>

            <div class="progress-bar">
                <div id="proteinProgressBar" class="progress-fill"></div>
            </div>
        </div>
    </div>

<!---------------------------------------- -Nährwerte Mahlzeiten Kreis anzeige -------------------------------------->
    <div class="meal-nutrition-summary">

        <div class="meal-nutrition-item">
            <div class="nutrition-circle calories-circle">
                <span id="mealCalories">0</span>
            </div>
            <p>Kalorien (kcal)</p>
        </div>

        <div class="meal-nutrition-item">
            <div class="nutrition-circle protein-circle">
                <span id="mealProtein">0</span>
            </div>
            <p>Protein (g)</p>
        </div>

        <div class="meal-nutrition-item">
            <div class="nutrition-circle fat-circle">
                <span id="mealFat">0</span>
            </div>
            <p>Fett (g)</p>
        </div>

        <div class="meal-nutrition-item">
            <div class="nutrition-circle carbs-circle">
                <span id="mealCarbs">0</span>
            </div>
            <p>Kohlenhydrate (g)</p>
        </div>

        <div class="meal-nutrition-item">
            <div class="nutrition-circle sugar-circle">
                <span id="mealSugar">0</span>
            </div>
            <p>Zucker (g)</p>
        </div>
    </div>
<!---------------------------------------------Frühstück----------------------------------------------->
    <div class="nutrition-meal-card" id="breakfast">

        <h2>Frühstück</h2>
            <div class="meal-food-list" id="breakfastFoods">
                <!-- Lebensmittel angezeigt/Lebensmittel hinzufügen -->
            </div>

        <button type="button" class="add-food-button" data-meal="breakfast">Lebensmittel hinzufügen</button>

    </div>
<!---------------------------------------------Mittagessen--------------------------------------------->
    <div class="nutrition-meal-card" id="lunch">

        <h2>Mittagessen</h2>
            <div class="meal-food-list" id="lunchFoods">
                <!-- Lebensmittel angezeigt/Lebensmittel hinzufügen -->
            </div>

        <button type="button" class="add-food-button" data-meal="lunch">Lebensmittel hinzufügen</button>

    </div>
<!---------------------------------------------Abendessen---------------------------------------------->
    <div class="nutrition-meal-card" id="dinner">

        <h2>Abendessen</h2>
            <div class="meal-food-list" id="dinnerFoods">
                <!-- Lebensmittel angezeigt/Lebensmittel hinzufügen -->
            </div>

        <button type="button" class="add-food-button" data-meal="dinner">Lebensmittel hinzufügen</button>

    </div>
<!---------------------------------------------Snacks---------------------------------------------->
    <div class="nutrition-meal-card" id="snacks">

        <h2>Snacks</h2>
            <div class="meal-food-list" id="snacksFoods">
                <!-- Lebensmittel angezeigt/Lebensmittel hinzufügen -->
            </div>

        <button type="button" class="add-food-button" data-meal="snacks">Lebensmittel hinzufügen</button>

    </div>
<!---------------------------------------------Lebensmittel hinzufügen--------------------------------->

    <div id="foodSearch" hidden>

        <h2>Lebensmittel hinzufügen</h2>

        <div class="food-search-inputs">

            <div class="food-search-field">
                <label for="foodSearchInput">Lebensmittel suchen:</label>
                <input type="search" id="foodSearchInput" placeholder="z. B. Harzer Käse">
            </div>

            <div class="food-search-field">
                <label for="foodGrams">Menge in Gramm:</label>
                <input type="number" id="foodGrams" min="1" step="1" placeholder="z. B. 100">
            </div>

        </div>

        <button type="button" id="searchFoodButton">Suchen</button>

        <div id="foodSearchResults">
            <!--Suchergebnisse angezeigen -->
        </div>

        <button type="button" id="addSelectedFood">Lebensmittel hinzufügen</button>
        <button type="button" id="closeFoodSearch">Schließen</button>
    </div>

    <script>
        //Datumseingabe und Textanzeige aus dem HTML holen
        const nutritionDate = document.getElementById("nutritionDate");
        const nutritionDateText = document.getElementById("nutritionDateText");

        //aktuelles Datum erstellen
        const today = new Date();                                       //Date ist eine eingebaute Funktion von JavaScript die das aktuelle Uhrzeit des Systems abfragt
        const year = today.getFullYear();
        const month = String(today.getMonth() + 1).padStart(2, "0");
        const day = String(today.getDate()).padStart(2, "0");

        nutritionDate.value = `${year}-${month}-${day}`;                //Template Literal

        //Ausgewähltes Datum auf Deutsch anzeigen
        function updateNutritionDate()
        {
            const selectedDate = new Date(nutritionDate.value + "T12:00:00");   //T trennt Datum und Uhrzeit; 12:00:00 bedeutet 12 Uhr mittags (Stunde:Minute:Sekunde)
                                                                                //verhindert, dass das Datum durch Zeitzonenverschiebungen versehentlich auf den Vortag oder Folgetag fällt
            nutritionDateText.textContent = new Intl.DateTimeFormat("de-DE",
                    {
                        weekday: "long",
                        day: "numeric",
                        month: "long",
                        year: "numeric"
                    }).format(selectedDate);
        }

        //Datum beim Laden und nach einer Änderung anzeigen
        updateNutritionDate();
        nutritionDate.addEventListener("change", function ()
        {
            updateNutritionDate();
            loadFood();
        });


        //Kalorienbedarfsrechner
        const calorieForm = document.getElementById("calorieForm");
        const calculateButton = document.getElementById("calculateCalories");

        const caloriesGoalElement = document.getElementById("caloriesGoal");
        const proteinGoalElement = document.getElementById("proteinGoal");

        const savedCalories = caloriesGoalElement.dataset.savedCalories;
        const savedProtein = proteinGoalElement.dataset.savedProtein;

        if (savedCalories && savedProtein)
        {
            caloriesGoalElement.textContent = savedCalories;
            proteinGoalElement.textContent = savedProtein;

            document.getElementById("calorieResult").textContent = "Dein Kalorienziel: " + savedCalories + " kcal pro Tag";
        }


        function CalorieNeedsCalculator()
        {
            if (!calorieForm.reportValidity())      //reportValidity = Prüft die HTML-Regeln deiner Eingabefelden ! kehrt true und false um
                {
                    return;
                }

            const formValues = Object.fromEntries(new FormData(calorieForm));

            const gender = formValues.gender;
            const weight = Number(formValues.weight);
            const height = Number(formValues.height);
            const age = Number(formValues.age);

            const activity = Number(formValues.activity);
            const goal = formValues.goal;

            let restingMetabolism;
            if (gender === "male")
                {
                    restingMetabolism = (10 * weight)+(6.25 * height)-(5 * age) + 5
                }

            else if (gender === "female")
                {
                    restingMetabolism = (10 * weight)+(6.25 * height)-(5 * age) - 161
                }
            else
                {
                    alert("Bitte alle Felder ausfüllen und auswählen.");
                    return;
                }

            const calorieNeeds = restingMetabolism * activity;

            let caloriegoal;

            if (goal === "lose")
                {caloriegoal = calorieNeeds - 400}
            else if (goal === "maintain")
                {caloriegoal = calorieNeeds - 0}
            else if (goal === "gain")
                {caloriegoal = calorieNeeds + 400}

            else
                {
                    alert("Bitte alle Felder ausfüllen und auswählen.");
                    return;
                }
            const proteinGoal = weight * 1.5;

            document.getElementById("calorieResult").textContent = "Dein Kalorienziel: " + Math.round(caloriegoal) + " kcal pro Tag";

            document.getElementById("caloriesGoal").textContent = Math.round(caloriegoal);
            document.getElementById("proteinGoal").textContent = Math.round(proteinGoal);

            fetch("/save-calorie-needs", {method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({
                    calories: Math.round(caloriegoal),
                    protein: Math.round(proteinGoal)
                })
            })
            .then(response => {if (!response.ok)
                {
                    throw new Error("Speichern fehlgeschlagen");
                }
            })
            .catch(error => {
                console.error("Fehler beim Speichern:", error);
                alert("Kalorienziel konnte nicht gespeichert werden.");
            });
        }

        calculateButton.addEventListener("click", CalorieNeedsCalculator);

        const addFoodButtons = document.querySelectorAll(".add-food-button");
        const foodSearch = document.getElementById("foodSearch");
        const closeFoodSearchButton = document.getElementById("closeFoodSearch");
        let selectedMeal = "";

        function addFoodButton(event)
        {
            const selectedMealCard = event.currentTarget.closest(".nutrition-meal-card");   //suchfenster unter die angeklickte Mahlzeitenkarte verschieben

            selectedMeal = event.currentTarget.dataset.meal;
            selectedMealCard.appendChild(foodSearch);

            event.currentTarget.hidden = true;
            foodSearch.hidden = false;
        }

        //Alle Lebensmittel Buttons mit der Funktion verbinden
        addFoodButtons.forEach(function (button) {button.addEventListener("click", addFoodButton);});


        function closeFoodSearch()
        {
            foodSearch.hidden = true;
        }

        closeFoodSearchButton.addEventListener("click", closeFoodSearch);


        //Lebensmittelsuche
        const foodSearchInput = document.getElementById("foodSearchInput");
        const searchFoodButton = document.getElementById("searchFoodButton");
        const foodSearchResults = document.getElementById("foodSearchResults");

        let selectedProduct = null;

        async function searchFood()                         //async = warten ohne website aufzuhalten
        {
            const searchTerm = foodSearchInput.value.trim();

            if (searchTerm === "")
            {
                foodSearchResults.textContent = "Bitte gib ein Lebensmittel ein.";
                return;
            }

            foodSearchResults.textContent = "Suche läuft...";

            try
            {
                const response = await fetch(`/search-food?q=${encodeURIComponent(searchTerm)}`);

                // Antwort von Flask als JSON auslesen
                const data = await response.json();

                if (!response.ok)
                {
                    foodSearchResults.textContent = data.error || "Die Suche ist fehlgeschlagen";
                    return;
                }

                const products = data.hits || [];

                //Alte Suchergebnisse entfernen
                foodSearchResults.replaceChildren();

                if (products.length === 0)
                {
                    foodSearchResults.textContent = "Keine Lebensmittel gefunden.";
                    return;
                }

                //HTML anzeigen
                products.forEach(function (product)
                {
                    //Button für das gefundene Produkt erstellen
                    const productButton = document.createElement("button");

                    productButton.type = "button";
                    productButton.className = "food-result-button";

                    //nährwerte aus Open Food Facts auslesen
                    const nutrients = product.nutriments || {};

                    const calories = nutrients["energy-kcal_100g"] ?? nutrients["energy-kcal"] ?? "Keine Angabe";       //?? verwendet "Keine Angabe", wenn kein Nährwert vorhanden ist
                    const protein = nutrients.proteins_100g ?? "Keine Angabe";
                    const fat = nutrients.fat_100g ?? "Keine Angabe";
                    const carbs = nutrients.carbohydrates_100g ?? "Keine Angabe";
                    const sugar = nutrients.sugars_100g ?? "Keine Angabe";


                    //Name und Nährwerte anzeigen
                    productButton.textContent = (product.product_name || "Produktname nicht vorhanden") +
                            "\n" + calories + " kcal" +
                            " | Eiweiß: " + protein + " g" +
                            " | Fett: " + fat + " g" +
                            " | Kohlenhydrate: " + carbs + " g" +
                            " | Zucker: " + sugar + " g";

                    productButton.addEventListener("click", function ()
                    {
                        selectedProduct = product;

                        foodSearchResults.querySelectorAll(".food-result-button").forEach(function (button)
                        {
                            button.classList.remove("selected");
                        });

                        productButton.classList.add("selected");

                    });

                    foodSearchResults.appendChild(productButton);
                });
            }
            catch (error)
            {
                console.error("Fehler bei der Lebensmittelsuche:", error);
                foodSearchResults.textContent = "Die Suche ist fehlgeschlagen. Bitte prüfe die Verbindung";
            }

        }

        searchFoodButton.addEventListener("click", searchFood);


        const addSelectedFoodButton = document.getElementById("addSelectedFood");

        addSelectedFoodButton.addEventListener("click", function ()
        {
            if (!selectedProduct)
            {
                alert("Bitte wähle zuerst ein Lebensmittel aus.");
                return;
            }

            const grams = Number(document.getElementById("foodGrams").value);

            if (!grams || grams <= 0)
            {
                alert("Bitte gib eine gültige Menge in Gramm ein.");
                return;
            }

            const mealFoodList = document.getElementById(selectedMeal + "Foods");

            if (!mealFoodList)
            {
                alert("Die Mahlzeit wurde nicht gefunden.");
                return;
            }

            const nutrients = selectedProduct.nutriments || {};
            const caloriesPer100g = Number(nutrients["energy-kcal_100g"] ?? nutrients["energy-kcal"] ?? 0);
            const addedCalories = caloriesPer100g * grams / 100;
            const proteinPer100g = Number(nutrients.proteins_100g ?? 0);
            const addedProtein = proteinPer100g * grams / 100;
            const addedFat = Number(nutrients.fat_100g ?? 0) * grams / 100;
            const addedCarbs = Number(nutrients.carbohydrates_100g ?? 0) * grams / 100;
            const addedSugar = Number(nutrients.sugars_100g ?? 0) * grams / 100;

            const caloriesConsumed = document.getElementById("caloriesConsumed");
            const calorieProgressBar = document.getElementById("calorieProgressBar");
            const caloriesGoal = Number(document.getElementById("caloriesGoal").textContent) || 0;
            const currentCalories = Number(caloriesConsumed.textContent) || 0;
            const totalCalories = currentCalories + addedCalories;

            const proteinConsumed = document.getElementById("proteinConsumed");
            const proteinProgressBar = document.getElementById("proteinProgressBar");
            const proteinGoal = Number(document.getElementById("proteinGoal").textContent) || 0;
            const currentProtein = Number(proteinConsumed.textContent) || 0;
            const totalProtein = currentProtein + addedProtein;

            proteinConsumed.textContent = Math.round(totalProtein);

            if (proteinGoal > 0)
            {
                proteinProgressBar.style.width = Math.min(totalProtein / proteinGoal * 100, 100) + "%";
            }

            caloriesConsumed.textContent = Math.round(totalCalories);

            if (caloriesGoal > 0)
            {
                calorieProgressBar.style.width = Math.min(totalCalories / caloriesGoal * 100, 100) + "%";
            }

            const foodItem = document.createElement("div");
            foodItem.className = "meal-food-item";

            foodItem.textContent = selectedProduct.product_name + " – " + grams + " g";

            mealFoodList.appendChild(foodItem);

            fetch("/save-food", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify(
                {
                    food_name: selectedProduct.product_name,
                    grams: grams,
                    calories: addedCalories,
                    protein: addedProtein,
                    fat: addedFat,
                    carbs: addedCarbs,
                    sugar: addedSugar,
                    meal: selectedMeal,
                    entry_date: document.getElementById("nutritionDate").value
                })
            })

            .then(response =>
            {
                if (!response.ok) {throw new Error("Lebensmittel konnte nicht gespeichert werden.");}
                return response.json();
            })

            .then(data =>
            {
                console.log("Lebensmittel gespeichert:", data);
                loadFood();         //lebensmittel und Nährwerte aktualisieren
            })

            .catch(error =>
            {
                console.error("Fehler beim Speichern:", error);
                alert("Das Lebensmittel konnte nicht gespeichert werden.");
            });

            selectedProduct = null;
            document.getElementById("foodGrams").value = "";
            foodSearch.hidden = true;

            const selectedButton = document.querySelector('.add-food-button[data-meal="' + selectedMeal + '"]');
            if (selectedButton)
            {
                selectedButton.hidden = false;
            }
        });

        //lebensmittel anzeigen
        async function loadFood()
        {
            const date = nutritionDate.value;

            try
            {
                const response = await fetch(`/get-food?date=${encodeURIComponent(date)}`);

                if (!response.ok)
                {
                    throw new Error("Lebensmittel konnten nicht geladen werden.");
                }

                const data = await response.json();
                console.log("Geladene Lebensmittel:", data.foods);
                let totalCalories = 0;
                let totalProtein = 0;
                let totalFat = 0;
                let totalCarbs = 0;
                let totalSugar = 0;

                document.querySelectorAll(".meal-food-list").forEach(function (list)
                {
                    list.replaceChildren();
                });

                //gespeicherte Lebensmittel anzeigen
                data.foods.forEach(function (food)
                {
                    totalCalories += Number(food[3]) || 0;
                    totalProtein += Number(food[4]) || 0;
                    totalFat += Number(food[5]) || 0;
                    totalCarbs += Number(food[6]) || 0;
                    totalSugar += Number(food[7]) || 0;

                    const foodItem = document.createElement("div");
                    foodItem.className = "meal-food-item";

                    const foodText = document.createElement("span");
                    foodText.textContent = food[1] + " – " + food[2] + " g";
                    foodItem.appendChild(foodText);

                    //bearbeiten-Button erstellen
                    const editButton = document.createElement("button");
                    editButton.type = "button";
                    editButton.textContent = "Bearbeiten";

                    editButton.addEventListener("click", async function ()
                    {
                        const newGrams = Number(prompt("Neue Grammzahl für " + food[1] + ":", food[2]));
                        if (!Number.isFinite(newGrams) || newGrams <= 0)
                        {
                            alert("Bitte gib eine gültige Grammzahl größer als 0 ein.");
                            return;
                        }

                        const oldGrams = Number(food[2]);
                        if (oldGrams <= 0)
                        {
                            alert("Die bisherige Grammzahl ist ungültig.");
                            return;
                        }

                        const factor = newGrams / oldGrams;
                        const response = await fetch("/update-food",
                        {
                            method: "POST",
                            headers: {"Content-Type": "application/json"},
                            body: JSON.stringify({
                                food_id: food[0],
                                grams: newGrams,
                                calories: Number(food[3]) * factor,
                                protein: Number(food[4]) * factor,
                                fat: Number(food[5]) * factor,
                                carbs: Number(food[6]) * factor,
                                sugar: Number(food[7]) * factor
                            })
                        });

                        if (!response.ok)
                        {
                            alert("Das Lebensmittel konnte nicht bearbeitet werden.");
                            return;
                        }
                        await loadFood();
                    });
                    foodItem.appendChild(editButton);

                    //löschen-Button erstellen
                    const deleteButton = document.createElement("button");
                    deleteButton.type = "button";
                    deleteButton.textContent = "Löschen";

                    deleteButton.addEventListener("click", async function ()
                    {
                        if (!confirm("Möchtest du " + food[1] + " wirklich löschen?"))
                        {
                            return;
                        }

                        const response = await fetch("/delete-food",
                                {
                                method: "POST",
                                headers: {"Content-Type": "application/json"},
                                body: JSON.stringify({food_id: food[0]})
                                });

                        if (!response.ok)
                        {
                            alert("Das Lebensmittel konnte nicht gelöscht werden.");
                            return;
                        }

                        await loadFood();
                    });
                    foodItem.appendChild(deleteButton);

                    const mealFoodList = document.getElementById(food[8] + "Foods");
                    if (mealFoodList)
                    {
                        mealFoodList.appendChild(foodItem);
                    }

                });
                //nährwerte Kreisen
                document.getElementById("mealCalories").textContent = Math.round(totalCalories);
                document.getElementById("mealProtein").textContent = Math.round(totalProtein);
                document.getElementById("mealFat").textContent = Math.round(totalFat);
                document.getElementById("mealCarbs").textContent = Math.round(totalCarbs);
                document.getElementById("mealSugar").textContent = Math.round(totalSugar);

                //kalorien aktualisieren
                const caloriesConsumed = document.getElementById("caloriesConsumed");
                const caloriesGoal = Number(document.getElementById("caloriesGoal").textContent) || 0;
                const calorieProgressBar = document.getElementById("calorieProgressBar");

                caloriesConsumed.textContent = Math.round(totalCalories);

                if (caloriesGoal > 0)
                {
                    const caloriePercentage = totalCalories / caloriesGoal * 100;

                    if (caloriePercentage <= 100)
                    {
                        calorieProgressBar.style.width = caloriePercentage + "%";
                        calorieProgressBar.style.background = "green";
                    }
                    else
                    {
                        const redPercentage = (totalCalories - caloriesGoal) / totalCalories * 100;

                        calorieProgressBar.style.width = "100%";
                        calorieProgressBar.style.background = `linear-gradient(to right, green 0%, green ${100 - redPercentage}%, red ${100 - redPercentage}%, red 100%)`;
                    }
                }
                else
                {
                    calorieProgressBar.style.width = "0%";
                    calorieProgressBar.style.background = "green";
                }

                //protein aktualisieren
                const proteinConsumed = document.getElementById("proteinConsumed");
                const proteinGoal = Number(document.getElementById("proteinGoal").textContent) || 0;
                const proteinProgressBar = document.getElementById("proteinProgressBar");

                proteinConsumed.textContent = Math.round(totalProtein);

                if (proteinGoal > 0)
                {
                    proteinProgressBar.style.width = Math.min(totalProtein / proteinGoal * 100, 100) + "%";     //% = weil CSS eine Prozentangabe benötigt
                }
                else
                {
                    proteinProgressBar.style.width = "0%";
                }

            }catch (error)
            {
                console.error("Fehler beim Laden der Lebensmittel:", error);
            }
        }

        loadFood();
    </script>

</body>
</html>
