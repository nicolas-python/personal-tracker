<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>Registrieren - Personal Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="register-page">

    <h1>Personal Tracker</h1>
    <h2>Registrieren</h2>

    <button type="button" onclick="window.location.href='/'">Zurück</button>

    {% with messages = get_flashed_messages(with_categories=true) %}   <!-- Jinja2-Syntax -->
        {% for category, message in messages %}

            <div class="popup">                     <!-- Fenster 1(Hintergrund) -->
                <div class="popup-content">         <!-- Fenster 2(Text) -->
                    <p>{{ message }}</p>

                {% if category == "success" %}
                    <button type="button" onclick="window.location.href='/'">OK</button>
                {% else %}
                    <button type="button" onclick="window.location.href='/register'">OK</button>
                {% endif %}
                </div>
            </div>

        {% endfor %}                                <!-- Beendet die for-Schleife -->
    {% endwith %}                                   <!-- Beendet den with-Block -->

    <form action="/register" method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <label for="username">Einlogname:</label>
        <input type="text" id="username" name="username">

        <label for="password">Passwort:</label>
        <input type="password" id="password" name="password">

        <label for="password_confirm">Passwort wiederholen:</label>
        <input type="password" id="password_confirm" name="password_confirm">

        <button type="submit">Registrieren</button>

        <div class="package-container">
            <h2>Paket auswählen</h2>

            <div class="package-options">
                <label class="package-card">
                    <h3>Basic</h3>
                    <h4>Kostenlos</h4>
                    <p>Grundfunktionen für deinen Personal Tracken</p>
                        <ul>
                            <li>Trainingspläne erstellen und verwalten</li>
                            <li>Übungen und Gewichte dokumentieren</li>
                            <li>Gespeicherte Workouts mit Timer abarbeiten</li>
                        </ul>
                    <input type="radio" name="package" value="basic">
                </label>

                <label class="package-card">
                    <h3>Premium</h3>
                    <h4>
                        <del class="old-price">4,99 € / Monat</del>            <!-- del = alten Preis durchstreichen -->
                        <span class="special-price"> 0,00 € Sonderangebot</span>
                    </h4>
                    <p>Erweiterte Funktionen und zusätzliche Statistiken</p>
                        <ul>
                            <li>Alle Basic-Funktionen</li>
                            <li>Kalorien- und Proteinbedarf berechnen</li>
                            <li>Ernährungstagebuch führen</li>
                            <li>Lebensmittel suchen und speichern</li>
                            <li>Trainings- und Ernährungsstatistiken</li>
                            <li>Gewichtsvergleiche</li>
                        </ul>
                    <input type="radio" name="package" value="premium">
                </label>

                <label class="package-card">
                    <h3>Premium+</h3>
                    <h4>
                        <del class="old-price">9,99 € / Monat</del>
                        <span class="special-price"> 0,00 € Sonderangebot</span>
                    </h4>
                    <p>Der volle Funktionsumfang deines Personal Trackers</p>
                        <ul>
                            <li>Alle Premium-Funktionen</li>
                            <li>Rezepte suchen und anzeigen</li>
                            <li>Tanken-Bereich</li>
                            <li>Zugriff auf alle verfügbaren App-Bereiche</li>
                        </ul>
                    <input type="radio" name="package" value="premium_plus">
                </label>
            </div>

        </div>

    </form>

</body>
</html>
