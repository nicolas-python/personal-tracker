<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrieren - Personal Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="register-page">

    <h1>Personal Tracker</h1>
    <h2>Registrieren</h2>

    <button type="button" onclick="window.location.href='/'">Zurück</button>

    {% with messages = get_flashed_messages(with_categories=true) %}   <!-- Jinja2-Syntax -->
        {% for category, message in messages %}

            <div class="popup">                     <!-- Fenster 1(Hintergrund) -->
                <div class="popup-content">         <!-- Fenster 2(Text) -->
                    <p>{{ message }}</p>

                {% if category == "success" %}
                    <button type="button" onclick="window.location.href='/'">OK</button>
                {% else %}
                    <button type="button" onclick="window.location.href='/register'">OK</button>
                {% endif %}
                </div>
            </div>

        {% endfor %}                                <!-- Beendet die for-Schleife -->
    {% endwith %}                                   <!-- Beendet den with-Block -->

    <form action="/register" method="POST">

        <label for="username">Einlogname:</label>
        <input type="text" id="username" name="username">

        <label for="password">Passwort:</label>
        <input type="password" id="password" name="password">

        <label for="password_confirm">Passwort wiederholen:</label>
        <input type="password" id="password_confirm" name="password_confirm">

        <button type="submit">Registrieren</button>

        <div class="package-container">
            <h2>Paket auswählen</h2>

            <div class="package-options">
                <label class="package-card">
                    <h3>Basic</h3>
                    <p>Grundfunktionen für deinen Personal Tracken</p>
                    <input type="radio" name="package" value="basic" required>
                </label>

                <label class="package-card">
                    <h3>Premium</h3>
                    <p>Erweiterte Funktionen und zusätzliche Statistiken</p>
                    <input type="radio" name="package" value="premium">
                </label>

                <label class="package-card">
                    <h3>Premium+</h3>
                    <p>Der volle Funktionsumfang deines Personal Trackers</p>
                    <input type="radio" name="package" value="premium_plus">
                </label>
            </div>

        </div>

    </form>

</body>

</html>
