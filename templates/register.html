<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <title>Registrieren - Personal Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <h1>Personal Tracker</h1>
    <h2>Registrieren</h2>

    {% with messages = get_flashed_messages(with_categories=true) %}   <!-- Jinja2-Syntax -->
        {% for category, message in messages %}

            <div class="popup">                     <!-- Fenster 1(Hintergrund) -->
                <div class="popup-content">         <!-- Fenster 2(Text) -->
                    <p>{{ message }}</p>

                {% if category == "success" %}
                    <button type="button" onclick="window.location.href='/'">OK</button>
                {% else %}
                    <button type="button" onclick="window.location.href='/register'">OK</button>
                {% endif %}
                </div>
            </div>

        {% endfor %}                                <!-- Beendet die for-Schleife -->
    {% endwith %}                                   <!-- Beendet den with-Block -->

    <form action="/register" method="POST">

        <label for="username">Einlogname:</label>
        <input type="text" id="username" name="username">

        <label for="password">Passwort:</label>
        <input type="password" id="password" name="password">

        <label for="password_confirm">Passwort wiederholen:</label>
        <input type="password" id="password_confirm" name="password_confirm">

        <button type="submit">Registrieren</button>

    </form>

</body>

</html>
