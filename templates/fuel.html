<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprit - Personal Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="fuel-page">
    <h1>Kraftstoffsuche</h1>
    <button class="backButton" onclick="window.location.href='/selection'"> Zurück</button>

    <h2>Tankstellensuche</h2>
    <div class="Gasstation-search-container">

        <label for="location">Postleitzahl</label>
        <input type="text" id="location" name="location"
               placeholder="z. B. 71032" maxlength="5">


        <label for="radius">Umkreis</label>
        <select id="radius" name="radius">
            <option value="5">5 km</option>
            <option value="10">10 km</option>
            <option value="15">15 km</option>
            <option value="20">20 km</option>
            <option value="25" selected>25 km</option>
        </select>

        <label for="fuel-type">Kraftstoff</label>
        <select id="fuel-type" name="fuel-type">
            <option value="diesel">Diesel</option>
            <option value="e5" selected>Super E5</option>
            <option value="e10">Super E10</option>
        </select>

        <button type="button" onclick="searchGasStations()">
            Tankstellen suchen
        </button>

        <div class="fuel-sort-buttons" style="display: none;">
            <button type="button" onclick="sortGasStations('price')">
                Günstigster Preis
            </button>

            <button type="button" onclick="sortGasStations('distance')">
                Kürzeste Entfernung
            </button>
        </div>

        <div id="gasstation-results"></div>
    </div>

    <h2>Kostenrechner</h2>
    <div class="fuel-calculator-box">
        <h3>Tankstellen-Sparrechner</h3>
        <div class="fuel-card-content">

            <div>
                <label for="price-a">Preis Tankstelle A (Euro / Liter)</label>
                <input type="number" id="price-a" placeholder="z. B. 1.85€">
            </div>

            <div>
                <label for="price-b">Preis Tankstelle B (Euro / Liter)</label>
                <input type="number" id="price-b" placeholder="z. B. 1.95€">
            </div>

            <div>
                <label for="fuel-amount">Tankmenge (Liter)</label>
                <input type="number" id="fuel-amount" placeholder="z. B. 50l">
            </div>

            <div>
                <button type="button" onclick="gasStationSavingsCalculator()">
                    Kosten berechnen
                </button>
            </div>

                <p id="savings-result"></p>
        </div>
    </div>

    <div class="fuel-calculator-box">
        <h3>Spritkosten</h3>
        <div class="fuel-card-content">

            <div>
                <label for="consumption">Verbrauch (Liter / 100 km)</label>
                <input type="number" id="consumption" name="consumption" placeholder="z. B. 8.5l">
            </div>

            <div>
                <label for="fuel-price">Kraftstoffpreis (Euro / Liter)</label>
                <input type="number" id="fuel-price" name="fuel-price" placeholder="z. B. 2.10€">
            </div>

            <div>
                <label for="distance">Gefahrene Strecke (km)</label>
                <input type="number" id="distance" name="distance" placeholder="z. B. 150km">
            </div>

            <div>
                <button type="button" onclick="calculateFuelCosts()">
                    Kosten berechnen
                </button>
            </div>

                <p id="fuel-result"></p>
        </div>
    </div>

    <div class="fuel-calculator-box">
        <h3>Reichweitenrechner</h3>
        <div class="fuel-card-content">

            <div>
                <label for="fuelcapacity">Tankinhalt (Liter)</label>
                <input type="number" id="fuelcapacity" name="fuelcapacity" placeholder="z. B. 50l">
            </div>

            <div>
                <label for="range-consumption">Verbrauch (Liter / 100 km)</label>
                <input type="number" id="range-consumption" name="range-consumption" placeholder="z. B. 8.5l">
            </div>

            <div>
                <button type="button" onclick="calculateFuelRange()">
                    Reichweite berechnen
                </button>
            </div>

                <p id="fuelrange-result"></p>
        </div>
    </div>


    <div class="fuel-calculator-box">
        <h3>Spritkosten in Arbeitsstunden</h3>
        <div class="fuel-card-content">

            <div>
                <label for="working-hours">Stundenlohn (Euro / Stunde)</label>
                <input type="number" id="working-hours" name="working-hours" placeholder="z. B. 20 €/h">
            </div>

            <div>
                <label for="tank-capacity">Tankinhalt (Liter)</label>
                <input type="number" id="tank-capacity" name="tank-capacity" placeholder="z. B. 50 Liter">
            </div>

            <div>
                <label for="work-fuel-price">Kraftstoffpreis (Euro / Liter)</label>
                <input type="number" id="work-fuel-price" name="work-fuel-price" placeholder="z. B. 2.10 €">
            </div>

            <div>
                <button type="button" onclick="calculateFuelCostsWorkHours()">
                    Arbeitszeit berechnen
                </button>
            </div>

                <p id="fuel-costs-work-hours-result"></p>
        </div>
    </div>

    <div class="fuel-calculator-box">
        <h3>Fahrtkosten nach Kilometer</h3>
        <div class="fuel-card-content">
            <div>
                <label for="work-consumption">Verbrauch (Liter / 100 km)</label>
                <input type="number" id="work-consumption" placeholder="z. B. 8.5l ">
            </div>

            <div>
                <label for="work-distance">Gefahrene Strecke (km)</label>
                <input type="number" id="work-distance" placeholder="z. B. 150 km">
            </div>

            <div>
                <label for="trip-fuel-price">Kraftstoffpreis (Euro / Liter)</label>
                <input type="number" id="trip-fuel-price" placeholder="z. B. 2.10€">
            </div>

            <div>
                <label for="trip-hourly-wage">Stundenlohn (Euro / Stunde)</label>
                <input type="number" id="trip-hourly-wage" placeholder="z. B. 20€/h">
            </div>

            <div>
                <button type="button" onclick="calculateFuelTripWorkHours()">
                    Arbeitszeit berechnen
                </button>
            </div>

                <p id="fuel-trip-work-hours-result"></p>
        </div>
    </div>


<script>
    let gasStations = [];
    let originalGasStations = [];

    async function searchGasStations()
    {
        const postalcode = document.getElementById("location").value.trim();
        const radius = document.getElementById("radius").value;
        const fuelType = document.getElementById("fuel-type").value;
        const resultsContainer = document.getElementById("gasstation-results");

        resultsContainer.textContent = "Tankstellen werden gesucht ...";

        try
        {
            const response = await fetch(
                    "/search-gas-stations?postalcode=" + encodeURIComponent(postalcode) +
                    "&radius=" + encodeURIComponent(radius) +
                    "&fuel=" + encodeURIComponent(fuelType)
            );

            const data = await response.json();

            if (!response.ok)
                {
                    resultsContainer.textContent = data.error;
                    document.querySelector(".fuel-sort-buttons").style.display = "none";
                    return;
                }

            if (!data.items || data.items.length === 0)
            {
                gasStations = [];
                resultsContainer.textContent = "Keine Tankstellen gefunden.";
                document.querySelector(".fuel-sort-buttons").style.display = "none";
                return;
            }

            gasStations = data.items;
            originalGasStations = [...data.items];      //... = Spread-Syntax = Erstellt eine neue Liste und kopiert alle Einträge aus data.items hinein
            displayGasStations();
        }
        catch (error)
            {
                resultsContainer.textContent = "Fehler: " + error.message;
            }
    }


    function sortGasStations(sortType)
    {
        gasStations = [...originalGasStations];
        if (sortType === "price")
        {
            gasStations.sort(function (a, b)
            {
                return a.priceCents - b.priceCents;
            });
        }
        else if (sortType === "distance")
            {
                gasStations.sort(function(a, b)
                {
                    return a.distanceM - b.distanceM;
                });
            }
        displayGasStations();
    }


    function displayGasStations()
    {
        const resultsContainer = document.getElementById("gasstation-results");

        resultsContainer.innerHTML = "";
        document.querySelector(".fuel-sort-buttons").style.display = "flex";

        gasStations.forEach(function(gasStation)
        {
            const gasStationElement = document.createElement("div");
            gasStationElement.className = "gasstation-card";

            const gasStationName = document.createElement("h3");
            gasStationName.textContent = gasStation.name;

            const gasStationAddress = document.createElement("p");
            gasStationAddress.textContent =
                gasStation.street + ", " +
                gasStation.postcode + " " +
                gasStation.city;

            const gasStationPrice = document.createElement("p");
            gasStationPrice.textContent = "Preis: " + (gasStation.priceCents / 1000).toFixed(2) + " €/Liter";          //preis umrechnen, da TankPuls den Wert ohne , liefert (z.b API-Wert: 2189 Umrechnung: 2189 / 1000 = 2.189€/liter Anzeige

            const gasStationDistance = document.createElement("p");
            gasStationDistance.textContent = "Entfernung: " + (gasStation.distanceM / 1000).toFixed(2) + " km";

            gasStationElement.append(
                gasStationName,
                gasStationAddress,
                gasStationPrice,
                gasStationDistance
            );

            resultsContainer.appendChild(gasStationElement);
        });
    }


    function gasStationSavingsCalculator()
    {
        let priceA = parseFloat(document.getElementById("price-a").value);
        let priceB = parseFloat(document.getElementById("price-b").value);
        let fuelAmount = parseFloat(document.getElementById("fuel-amount").value);

        if (isNaN(priceA) || isNaN(priceB) || isNaN(fuelAmount))
            {
                alert("Bitte alle Felder ausfüllen.");
                return;
            }

        let savings = Math.abs(priceA - priceB) * fuelAmount;
        document.getElementById("savings-result").textContent = "Du sparst: " + savings.toFixed(2) + " €";
    }

    function calculateFuelCosts()
    {
        let price = parseFloat(document.getElementById("fuel-price").value);
        let km = parseFloat(document.getElementById("distance").value);
        let verbrauch = parseFloat(document.getElementById("consumption").value);

        if (isNaN(price) || isNaN(km) || isNaN(verbrauch))              //prüft, ob der Eingabewert keine gültige Zahl ist (NaN = Not a Number)
            {
                alert("Bitte alle Felder ausfüllen.");
                return;
            }

        let fuelCosts = (verbrauch * km / 100) * price;

        document.getElementById("fuel-result").textContent = "Die Fahrt kostet: " + fuelCosts.toFixed(2) + " €";
    }

    function calculateFuelRange()
    {
        let fuel_capacity = parseFloat(document.getElementById("fuelcapacity").value);
        let consumption = parseFloat(document.getElementById("range-consumption").value);

        if (isNaN(fuel_capacity) || isNaN(consumption) || fuel_capacity <= 0 || consumption <= 0)
            {
                alert("Bitte alle Felder ausfüllen.");
                return;
            }

            let fuelrange_result = (fuel_capacity / consumption) * 100

            document.getElementById("fuelrange-result").textContent = "Der Tank reicht: " + fuelrange_result.toFixed(1) + " km";
    }

    function calculateFuelCostsWorkHours()
    {
        let workingHours = parseFloat(document.getElementById("working-hours").value);
        let tankCapacity = parseFloat(document.getElementById("tank-capacity").value);
        let fuelPrice = parseFloat(document.getElementById("work-fuel-price").value);

        if (isNaN(workingHours) || isNaN(tankCapacity) || isNaN(fuelPrice) ||
                workingHours <= 0 || tankCapacity <= 0 || fuelPrice <= 0)
        {
            alert("Bitte alle Felder ausfüllen.");
            return;
        }

        let tankCosts = tankCapacity * fuelPrice;
        let workTime = tankCosts / workingHours;
        let hours = Math.floor(workTime);
        let minutes = Math.round((workTime - hours) * 60);

        if (minutes === 60)
        {
            hours = hours + 1;
            minutes = 0;
        }

        document.getElementById("fuel-costs-work-hours-result").textContent = "Tankfüllung: " + tankCosts.toFixed(2) + " € | Arbeitszeit: " +
                                                                               hours + " Stunden und " + minutes + " Minuten";
    }


    function calculateFuelTripWorkHours()
    {
        let workingHours = parseFloat(document.getElementById("trip-hourly-wage").value);
        let fuelPrice = parseFloat(document.getElementById("trip-fuel-price").value);
        let consumption = parseFloat(document.getElementById("work-consumption").value);
        let distance = parseFloat(document.getElementById("work-distance").value);

        if (isNaN(workingHours) || isNaN(fuelPrice) || isNaN(consumption) || isNaN(distance) ||
                workingHours <= 0 || fuelPrice <= 0 || consumption <= 0 || distance <= 0)
        {
            alert("Bitte alle Felder ausfüllen.");
            return;
        }

        let fuelAmount = (consumption * distance) / 100;
        let fuelCosts = fuelAmount * fuelPrice;
        let workTime = fuelCosts / workingHours;

        let hours = Math.floor(workTime);
        let minutes = Math.round((workTime - hours) * 60);

        if (minutes === 60)
        {
            hours = hours + 1;
            minutes = 0;
        }

        document.getElementById("fuel-trip-work-hours-result").textContent = "Spritkosten: " + fuelCosts.toFixed(2) + " € | Arbeitszeit: " +
                                                                              hours + " Stunden und " + minutes + " Minuten";
    }
</script>
</body>

</html>
