<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprit - Personal Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="fuel-page">
    <h1>Tanken & Spritrechner</h1>
    <button class="backButton" onclick="window.location.href='/selection'"> Zurück</button>

    <h2>Tankstellensuche</h2>
    <div class="Gasstation-search-container">

        <label for="location">Postleitzahl</label>
        <input type="text" id="location" name="location"
               placeholder="z. B. 71032" maxlength="5">


        <label for="radius">Umkreis</label>
        <select id="radius" name="radius">
            <option value="5">5 km</option>
            <option value="10">10 km</option>
            <option value="15">15 km</option>
            <option value="20">20 km</option>
            <option value="25" selected>25 km</option>
        </select>

        <button type="button" onclick="searchGasStations()">
            Tankstellen suchen
        </button>

        <div id="gasstation-results"></div>
    </div>

    <h2>Spritrechner</h2>
        <div class="Fuel-calculator-container">

            <label for="consumption">Verbrauch (Liter / 100 km)</label>
            <input type="number" id="consumption" name="consumption" placeholder="z. B. 8.5l">

            <label for="fuel-price">Kraftstoffpreis (Euro / Liter)</label>
            <input type="number" id="fuel-price" name="fuel-price" placeholder="z. B. 2.10€">

            <label for="distance">Gefahrene Strecke (km)</label>
            <input type="number" id="distance" name="distance" placeholder="z. B. 150km">
        </div>


<script>
    async function searchGasStations()
    {
        const postalcode = document.getElementById("location").value.trim();
        const radius = document.getElementById("radius").value;
        const resultsContainer = document.getElementById("gasstation-results");

        resultsContainer.textContent = "Tankstellen werden gesucht ...";

        try
        {
            const response = await fetch(
                    "/search-gas-stations?postalcode=" + encodeURIComponent(postalcode) +
                    "&radius=" + encodeURIComponent(radius)
            );

            const data = await response.json();

            if (!response.ok)
                {
                    resultsContainer.textContent = data.error;
                    return;
                }

            resultsContainer.innerHTML = "";

            if (!data.items || data.items.length === 0)
                {
                    resultsContainer.textContent = "Keine Tankstellen gefunden.";
                    return;
                }

            data.items.forEach(function(gasStation)
                {
                    const gasStationElement = document.createElement("div");
                    gasStationElement.className = "gasstation-card";

                    const gasStationName = document.createElement("h3");
                    gasStationName.textContent = gasStation.name;

                    const gasStationAddress = document.createElement("p");
                    gasStationAddress.textContent =
                        gasStation.street + ", " +
                        gasStation.postcode + " " +
                        gasStation.city;

                    const gasStationPrice = document.createElement("p");
                    gasStationPrice.textContent = "Preis: " + (gasStation.priceCents / 1000).toFixed(2) + " €/Liter";       //preis umrechnen, da TankPuls den Wert ohne , liefert (z.b API-Wert: 2189 Umrechnung: 2189 / 1000 = 2.189€/liter Anzeige

                    const gasStationDistance = document.createElement("p");
                    gasStationDistance.textContent = "Entfernung: " + (gasStation.distanceM / 1000).toFixed(2) + " km";

                    gasStationElement.append(
                        gasStationName,
                        gasStationAddress,
                        gasStationPrice,
                        gasStationDistance
                    );

                    resultsContainer.appendChild(gasStationElement);
                });

        }
        catch (error)
            {
                resultsContainer.textContent = "Fehler: " + error.message;
            }
    }
</script>
</body>

</html>
